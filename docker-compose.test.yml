version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unihunt_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/unihunt_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"

  runner:
    image: node:18-bullseye
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/unihunt_test
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/unihunt_test
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      web:
        condition: service_started
    command: sh -c "npm ci && npx playwright install --with-deps && npm run e2e"
